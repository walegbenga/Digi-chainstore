services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sui-shop-postgres
    environment:
      - POSTGRES_USER=suishop
      - POSTGRES_PASSWORD=suishop
      - POSTGRES_DB=suishop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sui-shop-network
    restart: unless-stopped


  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sui-shop-backend-image
    container_name: sui-shop-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://suishop:suishop@postgres:5432/suishop?sslmode=disable
      - PACKAGE_ID=0x91512472e2e85f34695374394d88c7fa947700d87e53047c923f69dbbf27e877
      - MARKETPLACE_ID=0x2ce2f197c973c5804f296a4f45237d0401c235d05f200da603ce4570aef3ce1d
      - FRONTEND_URL=http://localhost:3000
      - PINATA_JWT=${PINATA_JWT}
      - ADMIN_KEY=${ADMIN_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@digichainstore.com}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - postgres
    networks:
      - sui-shop-network
    restart: unless-stopped

  # Blockchain Indexer (reuses backend image, different command)
  indexer:
    image: sui-shop-backend-image
    container_name: sui-shop-indexer
    command: npm run indexer
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://suishop:suishop@postgres:5432/suishop?sslmode=disable
      - PACKAGE_ID=0x91512472e2e85f34695374394d88c7fa947700d87e53047c923f69dbbf27e877
      - MARKETPLACE_ID=0x2ce2f197c973c5804f296a4f45237d0401c235d05f200da603ce4570aef3ce1d
      - SUI_RPC_URL=https://sui-testnet.mystenlabs.com/graphql
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@digichainstore.com}
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - postgres
      - backend
    networks:
      - sui-shop-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sui-shop-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_SUI_NETWORK=testnet
      - NEXT_PUBLIC_PACKAGE_ID=0x91512472e2e85f34695374394d88c7fa947700d87e53047c923f69dbbf27e877
      - NEXT_PUBLIC_MARKETPLACE_ID=0x2ce2f197c973c5804f296a4f45237d0401c235d05f200da603ce4570aef3ce1d
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - sui-shop-network
    restart: unless-stopped

networks:
  sui-shop-network:
    driver: bridge

volumes:
  postgres_data: