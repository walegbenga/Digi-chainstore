version: "3.9"

services:

# ---------------------------------

# Sui Smart Contract Deployment

# ---------------------------------

sui-deploy:
build:
context: .
dockerfile: contracts/Dockerfile
container_name: sui-shop-deploy

```
# Keep container interactive (optional but useful)
stdin_open: true
tty: true

# Mount contracts and wallet
volumes:
  - ./move:/contracts
  - sui-wallet:/root/.sui

# Set working directory
working_dir: /contracts

# Default command (can be overridden)
command: sh

environment:
  SUI_NETWORK: testnet
  SUI_RPC_URL: https://fullnode.testnet.sui.io:443

networks:
  - sui-network

restart: "no"
```

volumes:
sui-wallet:
driver: local

networks:
sui-network:
driver: bridge
